<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>KLARO* — Photobooth</title>
    <meta
      name="description"
      content="KLARO* is a portable camera-first photobooth for live capture, strip layouts, filters, and local gallery exports."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="top-bar">
        <div class="brand" aria-label="KLARO logo">KLARO<span>*</span></div>
        <div class="header-actions">
          <button id="galleryBtn" class="ghost-button" type="button">Gallery</button>
          <button id="stripsBtn" class="ghost-button" type="button">Strips</button>
        </div>
      </header>

      <main class="camera-screen">
        <div class="camera-stage">
          <video id="cameraVideo" autoplay playsinline muted></video>
          <div id="cameraCanvasWrap" class="canvas-wrap hidden"></div>
          <div id="flashOverlay" class="flash-overlay" aria-hidden="true"></div>
          <div id="countdownBadge" class="countdown-badge" aria-live="polite">5</div>
          <div id="permissionMessage" class="permission-message hidden"></div>
          <div id="cameraGrid" class="grid-overlay hidden"></div>
          <div id="levelGuide" class="level-guide hidden"></div>

          <div class="tool-stack right-stack">
            <div class="tool-wrap">
              <button id="timerBtn" class="tool-button" type="button" aria-label="Timer">
                <span>⏱</span>
              </button>
              <small id="timerLabel">5s</small>
            </div>
            <div class="tool-wrap">
              <button id="flashToggleBtn" class="tool-button is-on" type="button" aria-label="Flash">
                <span>⚡</span>
              </button>
              <small>Flash</small>
            </div>
            <div class="tool-wrap">
              <button id="flipCameraBtn" class="tool-button" type="button" aria-label="Flip camera">
                <span>⇄</span>
              </button>
              <small>Flip</small>
            </div>
            <div class="tool-wrap">
              <button id="uploadBtn" class="tool-button" type="button" aria-label="Upload photo">
                <span>↑</span>
              </button>
              <small>Upload</small>
            </div>
            <div class="tool-wrap">
              <button id="settingsBtn" class="tool-button" type="button" aria-label="Settings">
                <span>⋯</span>
              </button>
              <small>More</small>
            </div>
          </div>

          <div class="bottom-controls">
            <button id="galleryShortcut" class="mini-action" type="button">Recent</button>
            <button id="captureBtn" class="capture-button" type="button" aria-label="Capture photo">
              <span></span>
            </button>
            <button id="stripsShortcut" class="mini-action" type="button">Strips</button>
          </div>
        </div>
      </main>
    </div>

    <input id="uploadInput" type="file" accept="image/*" hidden />

    <aside id="stripsSheet" class="sheet hidden" aria-label="Photobooth strips panel">
      <div class="sheet-header">
        <h2>Strips</h2>
        <button id="closeStripsBtn" class="text-button" type="button">Close</button>
      </div>

      <section class="sheet-section">
        <h3>Layouts</h3>
        <div id="layoutOptions" class="option-grid"></div>
      </section>

      <section class="sheet-section">
        <h3>Filters</h3>
        <div id="filterOptions" class="option-grid filter-grid"></div>
      </section>
    </aside>

    <aside id="settingsSheet" class="sheet hidden" aria-label="Camera settings panel">
      <div class="sheet-header">
        <h2>Settings</h2>
        <button id="closeSettingsBtn" class="text-button" type="button">Close</button>
      </div>

      <div class="setting-list">
        <label class="setting-row">
          <span>Grid</span>
          <input id="gridToggle" type="checkbox" />
        </label>
        <label class="setting-row">
          <span>Level guide</span>
          <input id="levelToggle" type="checkbox" />
        </label>
        <label class="setting-row">
          <span>Mirror selfie</span>
          <input id="mirrorToggle" type="checkbox" checked />
        </label>
        <label class="setting-row">
          <span>Default timer</span>
          <select id="timerSelect">
            <option value="3">3s</option>
            <option value="5" selected>5s</option>
            <option value="10">10s</option>
          </select>
        </label>
        <label class="setting-row">
          <span>Shots</span>
          <select id="shotsSelect">
            <option value="2">2</option>
            <option value="4" selected>4</option>
            <option value="6">6</option>
          </select>
        </label>
        <label class="setting-row">
          <span>Interval</span>
          <select id="intervalSelect">
            <option value="0.5">0.5s</option>
            <option value="1" selected>1s</option>
            <option value="2">2s</option>
            <option value="3">3s</option>
          </select>
        </label>
        <label class="setting-row">
          <span>Shutter sound</span>
          <input id="soundToggle" type="checkbox" checked />
        </label>
        <label class="setting-row">
          <span>Capture flash</span>
          <input id="captureFlashToggle" type="checkbox" checked />
        </label>
      </div>
    </aside>

    <aside id="galleryDrawer" class="sheet hidden" aria-label="Saved photo gallery">
      <div class="sheet-header">
        <h2>Gallery</h2>
        <button id="closeGalleryBtn" class="text-button" type="button">Close</button>
      </div>
      <div id="galleryList" class="gallery-list"></div>
      <button id="clearGalleryBtn" class="danger-button" type="button">Clear local gallery</button>
    </aside>

    <div id="resultSheet" class="result-sheet hidden" aria-live="polite">
      <div class="sheet-header result-header">
        <h2>Ready to save</h2>
        <button id="closeResultBtn" class="text-button" type="button">Close</button>
      </div>

      <canvas id="resultCanvas" width="900" height="1500"></canvas>
      <div id="resultThumbs" class="result-thumbs"></div>

      <div class="result-actions">
        <button id="retakeShotBtn" class="action-button" type="button">Retake</button>
        <button id="saveResultBtn" class="action-button primary" type="button">Save</button>
        <button id="downloadResultBtn" class="action-button" type="button">Download</button>
        <button id="shareResultBtn" class="action-button" type="button">Share</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
